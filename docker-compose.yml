services:
  api:
    build: .
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./chroma_db:/app/chroma_db
      - ./mlflow_data:/app/mlflow_data
      - ./.ingested_hashes.json:/app/.ingested_hashes.json
    env_file:
      - .env
    environment:
      - MLFLOW_TRACKING_URI=sqlite:////app/mlflow_data/mlruns.db

  app:
    build: .
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - API_BASE_URL=http://api:8000
    depends_on:
      - api

  mlflow:
    build: .
    command: mlflow ui --backend-store-uri sqlite:////app/mlflow_data/mlruns.db --host 0.0.0.0 --port 5000
    ports:
      - "5000:5000"
    volumes:
      - ./mlflow_data:/app/mlflow_data
