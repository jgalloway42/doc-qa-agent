[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "doc-qa-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=0.5.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langchain-openai>=0.2.0",
    "langgraph>=0.2.0",
    "mlflow>=2.16.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pypdf>=4.0.0",
    "pdf2image>=1.17.0",
    "pytesseract>=0.3.13",
    "python-docx>=1.1.0",
    "sentence-transformers>=3.0.0",
    "simpleeval>=1.0.0",
    "streamlit>=1.38.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "reportlab>=4.0.0",
]

[project.scripts]
doc-qa-ingest = "cli.ingest_cli:app"

[tool.hatch.build.targets.wheel]
packages = ["doc_qa", "config", "cli", "ui"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=doc_qa --cov-report=term-missing --cov-fail-under=80"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
omit = ["ui/*", "cli/*", "tests/*", "config/*"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
